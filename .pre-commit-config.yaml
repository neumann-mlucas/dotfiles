repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-yaml
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        exclude: ^dot-config/zsh/functions$

  - repo: https://github.com/JohnnyMorganz/StyLua
    rev: v2.5.2
    hooks:
      - id: stylua
        files: \.lua$

  - repo: https://github.com/crate-ci/typos
    rev: v1.49.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: typos-commit-msg
        name: typos commit message
        entry: bash -c 'awk "/^diff --git / { exit } { print }" "$1" | typos -' --
        language: system
        stages: [commit-msg]
        always_run: true
      - id: skill-skeleton-shellcheck
        name: shellcheck shell-guidelines skeleton
        # SC2034 expected: skeleton's main() is a stub, vars unused by design
        entry: bash -c 'awk "/^\`\`\`bash$/{f=1;next} /^\`\`\`/{if(f)exit} f" agents/skills/shell-guidelines/SKILL.md | shellcheck -e SC2034 -'
        language: system
        files: ^agents/skills/shell-guidelines/SKILL\.md$
        pass_filenames: false
      - id: claude-hooks-test
        name: claude code hooks self-test
        entry: dot-claude/hooks/test-hooks.sh
        language: system
        files: ^dot-claude/hooks/
        pass_filenames: false
      - id: stow-dry-run
        name: stow --no dry run
        entry: bash -c 'mkdir -p /tmp/stow-target && stow --dir="$PWD" --target=/tmp/stow-target --no --verbose=1 --dotfiles .'
        language: system
        pass_filenames: false
        stages: [pre-push]
